<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>EgoDeathSquad</title>
<meta name="theme-color" content="#0A0A0B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23FF2D95'/%3E%3Cpath d='M8 8h16M8 16h12M8 24h16' fill='none' stroke='%230A0A0B' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root { --bg: #0A0A0B; --line: #2B2B2F; --text: #EDEDE6; --dim: #9A9A92; --lime: #C8FF2E; --pink: #FF2D95; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body { color: var(--text); font-family: 'Space Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 14px; line-height: 1.5; }
  .mono-label { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .shell { max-width: 1200px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  .status, footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; padding: 12px 24px; color: var(--dim); }
  .status { border-bottom: 1px solid var(--line); }
  footer { border-top: 1px solid var(--line); }
  .status .live::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; background: var(--pink); }
  main { flex: 1; display: flex; flex-direction: column; background: var(--lime); color: var(--bg); padding: 24px 24px 20px; min-height: 260px; overflow: hidden; }
  .top { display: flex; justify-content: space-between; gap: 16px; }
  .barcode { width: 150px; height: 44px; flex: none; background: repeating-linear-gradient(90deg, var(--bg) 0 2px, transparent 2px 5px, var(--bg) 5px 6px, transparent 6px 10px, var(--bg) 10px 14px, transparent 14px 16px, var(--bg) 16px 17px, transparent 17px 21px); }
  h1 { margin: auto 0 0; padding-top: 24px; font-family: 'Archivo', 'Arial Black', sans-serif; font-stretch: 125%; font-weight: 900; font-size: clamp(44px, min(12.5vw, 26vh), 170px); line-height: 0.84; letter-spacing: -0.045em; text-transform: uppercase; margin-left: -0.04em; }
  h1 .dot { color: var(--pink); }
  .bottom { margin-top: 16px; padding-top: 12px; border-top: 3px solid var(--bg); }
  .hazard { height: 12px; background: repeating-linear-gradient(-45deg, var(--lime) 0 14px, var(--bg) 14px 28px); }
  @media (max-width: 720px) { .status, footer, main { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<div class="shell">
  <div class="status mono-label"><span class="live">Online</span><span>egodeathsquad.au</span></div>
  <main>
    <div class="top mono-label">
      <div>File 001 / Public<br>Subject: ego death squad</div>
      <div class="barcode" aria-hidden="true"></div>
    </div>
    <h1>Ego death<br>squad<span class="dot">.</span></h1>
    <div class="bottom mono-label">Australia</div>
  </main>
  <div class="hazard" aria-hidden="true"></div>
  <footer class="mono-label"><span>End of file</span><span>egodeathsquad.au///</span></footer>
</div>
</body>
</html>
